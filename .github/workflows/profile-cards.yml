name: Profile summary cards

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-cards.yml" # run once as soon as this file is added

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses your personal token if you create the SUMMARY_GITHUB_TOKEN secret,
          # otherwise falls back to the token GitHub provides automatically.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 1
